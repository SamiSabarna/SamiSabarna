<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sami Sabarna — Intelligent Automation Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a14"/>
      <stop offset=".55" stop-color="#0a1830"/>
      <stop offset="1" stop-color="#062d38"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="halo" cx=".78" cy=".45" r=".45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1b3456"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flow { fill: none; stroke: url(#acc); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 5 9; animation: dash 1.8s linear infinite; opacity: .85 }
      @keyframes dash { to { stroke-dashoffset: -28 } }
      .node { fill: #0b1f36; stroke: #22d3ee; stroke-width: 2 }
      .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
      @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1) } 50% { opacity: .9; transform: scale(1.35) } }
      .lbl { font: 700 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #cbd5e1; letter-spacing: 1.5px; text-anchor: middle }
      .name { font: 800 58px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #f8fafc; letter-spacing: -1px }
      .role { font: 600 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#acc) }
      .tags { font: 600 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8ea3bf; letter-spacing: 3px }
      .chip { font: 600 13px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #e2e8f0 }
      .d1 { animation-delay: .4s } .d2 { animation-delay: .8s } .d3 { animation-delay: 1.2s } .d4 { animation-delay: 1.6s } .d5 { animation-delay: 2s }
    </style>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#dots)" opacity=".55"/>
  <rect width="1200" height="300" fill="url(#halo)"/>

  <!-- automation flow: trigger -> RPA / BPM -> AI -> API -> done -->
  <path class="flow" d="M700 150 C 740 150, 760 85, 805 85"/>
  <path class="flow" d="M700 150 C 740 150, 760 215, 805 215"/>
  <path class="flow" d="M840 85 C 890 85, 900 150, 950 150"/>
  <path class="flow" d="M840 215 C 890 215, 900 150, 950 150"/>
  <path class="flow" d="M985 150 C 1020 150, 1030 95, 1065 95"/>
  <path class="flow" d="M985 150 C 1020 150, 1030 205, 1065 205"/>
  <path class="flow" d="M1100 95 C 1130 95, 1135 150, 1160 150"/>
  <path class="flow" d="M1100 205 C 1130 205, 1135 150, 1160 150"/>

  <g filter="url(#glow)">
    <circle class="pulse" cx="683" cy="150" r="17" fill="#22d3ee" opacity=".4"/>
    <circle class="node" cx="683" cy="150" r="15"/>
    <circle class="pulse d1" cx="822" cy="85" r="19" fill="#22d3ee" opacity=".4"/>
    <circle class="node" cx="822" cy="85" r="17"/>
    <circle class="pulse d2" cx="822" cy="215" r="19" fill="#38bdf8" opacity=".4"/>
    <circle class="node" cx="822" cy="215" r="17"/>
    <circle class="pulse d3" cx="967" cy="150" r="21" fill="#a78bfa" opacity=".45"/>
    <circle class="node" cx="967" cy="150" r="19" style="stroke:#a78bfa"/>
    <circle class="pulse d4" cx="1082" cy="95" r="18" fill="#818cf8" opacity=".4"/>
    <circle class="node" cx="1082" cy="95" r="16" style="stroke:#818cf8"/>
    <circle class="pulse d5" cx="1082" cy="205" r="18" fill="#818cf8" opacity=".4"/>
    <circle class="node" cx="1082" cy="205" r="16" style="stroke:#818cf8"/>
    <circle cx="1170" cy="150" r="9" fill="#22d3ee"/>
  </g>
  <!-- small glyphs inside nodes -->
  <path d="M677 144 L691 150 L677 156 Z" fill="#22d3ee"/>
  <rect x="814" y="78" width="16" height="13" rx="3" fill="none" stroke="#e2e8f0" stroke-width="2"/><circle cx="819" cy="84" r="1.6" fill="#e2e8f0"/><circle cx="825" cy="84" r="1.6" fill="#e2e8f0"/><line x1="822" y1="74" x2="822" y2="78" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M814 210 h7 v-4 h8 v14 h-8 v-4 h-7 z" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="967" cy="150" r="7" fill="none" stroke="#e9d5ff" stroke-width="2"/><circle cx="967" cy="150" r="2.5" fill="#e9d5ff"/>
  <path d="M1075 95 l-4 0 m14 0 l4 0 M1078 90 l8 10 M1086 90 l-8 10" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round"/>
  <path d="M1076 205 l4 4 l8 -9" fill="none" stroke="#e2e8f0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="lbl" x="683" y="188">TRIGGER</text>
  <text class="lbl" x="822" y="52">RPA</text>
  <text class="lbl" x="822" y="254">BPM</text>
  <text class="lbl" x="967" y="192">AI</text>
  <text class="lbl" x="1082" y="62">API</text>
  <text class="lbl" x="1082" y="244">DONE</text>

  <!-- identity -->
  <rect x="60" y="62" width="70" height="5" rx="2.5" fill="url(#acc)"/>
  <text class="name" x="56" y="132">Sami Sabarna</text>
  <text class="role" x="60" y="172">Intelligent Automation Engineer</text>
  <text class="tags" x="60" y="206">RPA · BPM · LOW-CODE · AI AGENTS · INTEGRATION</text>

  <g>
    <rect x="60" y="226" width="150" height="30" rx="15" fill="#0f2741" stroke="#22d3ee" stroke-opacity=".6"/>
    <text class="chip" x="135" y="246" text-anchor="middle">◆ Appian Certified</text>
    <rect x="222" y="226" width="172" height="30" rx="15" fill="#0f2741" stroke="#a78bfa" stroke-opacity=".6"/>
    <text class="chip" x="308" y="246" text-anchor="middle">◆ Blue Prism Certified</text>
    <rect x="406" y="226" width="140" height="30" rx="15" fill="#0f2741" stroke="#334155"/>
    <text class="chip" x="476" y="246" text-anchor="middle">📍 Amman, Jordan</text>
  </g>
</svg>
